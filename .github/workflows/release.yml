name: build

# Every push builds all three platforms, x64 and arm64. A v* tag also publishes a GitHub release with the bundles.
# Updater bundles (.app.tar.gz, setup.exe and .AppImage .sig files) are made only when the repo secret
# TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) is set: the CLI then gets
# src-tauri/tauri.updater.conf.json. Without it the build is the same as before, with no updater artifacts.
# gosubstrate.com serves the downloads and updates after Apps/kit/mirror-census-app.mjs (Substrate vault) copies a
# release there.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: 'Validate company Windows signatures without publishing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      id-token: write
    environment: ${{ startsWith(matrix.os, 'windows-') && github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || inputs.sign_windows) && 'windows-signing' || '' }}
    env:
      SIGN_WINDOWS: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || inputs.sign_windows) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          # arm64 Windows and Linux (free on public repos). Experimental: a failure never fails the run.
          - os: windows-11-arm
            args: ""
            experimental: true
          - os: ubuntu-24.04-arm
            args: ""
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Offline signing regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-signing.test.ps1
      - name: Windows signing configuration
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: |
          foreach ($name in 'AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','TRUSTED_SIGNING_ENDPOINT','TRUSTED_SIGNING_ACCOUNT','TRUSTED_SIGNING_PROFILE') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing configuration: $name" }
          }

      - name: Azure login for Windows signing
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Windows signing tools
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: ./scripts/windows-sign-setup.ps1 -ConfigPath "$env:RUNNER_TEMP/windows-sign.json"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bunx tauri
          args: ${{ matrix.args }} ${{ runner.os == 'Windows' && '--bundles nsis' || '' }} ${{ env.WINDOWS_SIGN_CONFIG != '' && format('--config {0}', env.WINDOWS_SIGN_CONFIG) || '' }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          tagName: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Substrate Census ${{ github.ref_name }}
          releaseBody: |
            One window, one button: runs the Substrate AI Software Census and links you to your dashboard.
            Windows installers are signed by Substrate Holdings LLC. See README for platform-specific first-launch guidance.
          releaseDraft: false
          prerelease: false

      - name: Upload build-only Windows installers
        if: runner.os == 'Windows' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: census-${{ matrix.os }}
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 14
