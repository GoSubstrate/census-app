[package]
name = "substrate-census"
version = "0.1.0"
description = "Substrate Census: the AI software census, one click"
authors = ["Substrate"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "census_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Updates from gosubstrate.com (updates.rs); key and endpoint in tauri.conf.json.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Companion installs (companions.rs): the release answer and the installer download, rustls + webpki roots.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# An app's bundle id from its Info.plist (XML or binary).
plist = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
