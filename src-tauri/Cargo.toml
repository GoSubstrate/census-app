[package]
name = "substrate-census"
version = "0.1.0"
description = "Substrate Census: the AI software census, one click"
authors = ["Substrate"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "census_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
